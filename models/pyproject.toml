[project]
name = "forestrecovery"
version = "0.1.0"
description = "Forest state and recovery models (NISAR, Sentinel-1, NDVI)"
requires-python = ">=3.10"
dependencies = ["numpy", "scikit-learn"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["forestrecovery*"]
