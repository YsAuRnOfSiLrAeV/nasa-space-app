[project]
name = "forest-recovery-backend"
version = "0.1.0"
description = "Pipeline: fire polygon -> imagery on a shared grid -> model -> result files"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "shapely>=2.0",
    "pyproj",
    "affine",
    "rasterio",
    "h5py",
    "earthaccess",
    "earthengine-api",
    "python-dotenv",
]

[project.optional-dependencies]
api = ["fastapi", "uvicorn"]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pipeline*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]